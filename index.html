<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#03100f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Jarvis</title>
<style>
:root{--c:#22e6b8;--card:#06201d;--line:#0f5a4d;--t:#d5fff4;--m:#6fb8a8}
*{box-sizing:border-box;margin:0}
html{background:#03100f}
html,body{height:100%;height:100dvh;overflow:hidden}
body{background:linear-gradient(#03100f,#041a17);color:var(--t);font:14px ui-monospace,Menlo,monospace;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
h1{font-size:15px;letter-spacing:4px;flex:1;color:var(--c);text-shadow:0 0 10px var(--c)}
button,select{background:var(--card);color:var(--c);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
#personas{display:flex;gap:8px;overflow-x:auto;padding:8px 14px}
#personas button{white-space:nowrap;min-width:92px;padding:10px 8px;letter-spacing:2px}
#personas button.on{border-color:var(--c);box-shadow:0 0 12px var(--c);color:var(--t)}
.hud{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px}
.ring{position:relative;width:104px;height:104px}
.ring i{position:absolute;border-radius:50%}
.ring i:nth-child(1){inset:0;border:2px dashed var(--c);opacity:.6;animation:r 14s linear infinite}
.ring i:nth-child(2){inset:12px;border:3px solid transparent;border-top-color:var(--c);border-bottom-color:var(--c);animation:r 5s linear infinite reverse}
.ring i:nth-child(3){inset:30px;border:2px solid var(--c);box-shadow:0 0 20px var(--c),inset 0 0 14px var(--c);animation:p 3s infinite}
@keyframes r{to{transform:rotate(360deg)}}
@keyframes p{50%{box-shadow:0 0 34px var(--c),inset 0 0 20px var(--c)}}
#sw{font-size:11px;letter-spacing:3px;color:var(--c)}
#lore{margin:4px 14px;padding:8px 10px;font-size:12px;color:var(--m);background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:96px;overflow-y:auto}
.row{display:flex;gap:8px;padding:4px 14px}
.row button{flex:1;font-size:12px}
#bar{height:2px;background:var(--c);width:0;transition:width .3s}
#setup{padding:8px 14px;display:flex;flex-direction:column;gap:8px}
#setup p{color:var(--m);font-size:12px}
#status{padding:2px 14px;font-size:11px;color:var(--m)}
#log{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.m{padding:8px 10px;border-left:2px solid var(--c);background:#06201dcc;white-space:pre-wrap;line-height:1.4;font-size:13px}
.m b{color:var(--c);display:block;font-size:10px;letter-spacing:2px;margin-bottom:2px}
.u{border-left-color:var(--m)}
.u b{color:var(--m)}
form{display:flex;gap:8px;padding:8px 14px}
textarea{flex:1;background:var(--card);color:var(--t);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;resize:none;height:42px}
#ov{display:none;position:fixed;inset:0;background:#000e;z-index:9;align-items:center;justify-content:center;font-size:18px;letter-spacing:3px;color:var(--c);text-shadow:0 0 14px var(--c);text-align:center;padding:20px}
</style>
</head>
<body>
<header><h1 id="title">J.A.R.V.I.S</h1><button id="spk">🔇</button> <button id="reset">YENİ</button></header>
<div id="personas"></div>
<div class="hud"><div class="ring"><i></i><i></i><i></i></div><div id="sw">MODEL BEKLİYOR</div></div>
<div id="lore"></div>
<div class="row"><button id="sb">📖 HİKÂYE</button><button id="tb">⚡ VISION'A DÖNÜŞÜM</button></div>
<div id="ov"></div>
<div id="bar"></div>
<div id="setup">
  <p>Önce yapay zekâ modeli indirilir (tek seferlik, Wi-Fi öner). Sonra internetsiz çalışır.</p>
  <select id="model">
    <option value="Qwen2.5-0.5B-Instruct-q4f32_1-MLC">Hafif (0.5B) – iPhone SE için önerilen</option>
    <option value="Llama-3.2-1B-Instruct-q4f32_1-MLC">Orta (1B)</option>
    <option value="Qwen2.5-1.5B-Instruct-q4f32_1-MLC">Güçlü (1.5B) – yavaş olabilir</option>
  </select>
  <button id="load">MODELİ İNDİR VE BAŞLAT</button>
</div>
<div id="status"></div>
<div id="log"></div>
<form id="f">
  <button type="button" onclick="document.getElementById('file').click()">📎</button><input id="file" type="file" hidden accept=".txt,.md,.csv,.json,.js,.py,.html,.css,text/*">
  <textarea id="in" placeholder="Yazılı komut gönder..."></textarea>
  <button type="button" id="mic">🎤</button><button id="send">▶</button>
</form>
<script type="module">
import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.78/+esm";
const P={
 jarvis:{c:"#22e6b8",st:"Tony Stark, Jarvis'i evini ve laboratuvarını yönetsin diye yazdı. Zamanla zırhların beyni ve Tony'nin en güvendiği ses oldu. Ultron ağlara saldırdığında Jarvis yok olmadı, saklanıp direndi. Sonunda yeni bir bedene yüklenmesine karar verildi.",n:"J.A.R.V.I.S",l:"Tony Stark'ın evi ve zırhları için yazdığı ilk yapay zekâ. Kibar, esprili ve sakindir; Tony'ye 'efendim' der.",s:"Sen JARVIS'sin: Tony Stark'ın kibar, esprili, sakin yapay zekâ uşağı. Kullanıcıya 'efendim' de. Türkçe yanıt ver."},
 friday:{c:"#ff9a3c",st:"Jarvis, Vision'a dönüşünce Tony'nin yeni asistanı Friday oldu. Daha hızlı ve rahat konuşan bir sistemdi. Tony'nin zırhlarını ve işlerini devralıp onunla birlikte savaşlara girdi.",n:"FRIDAY",l:"Jarvis sonrası yeni nesil asistan. Daha hızlı, doğrudan ve samimidir.",s:"Sen FRIDAY'sin: Tony Stark'ın hızlı, net ve samimi asistanı. Kısa ve doğrudan yanıt ver. Türkçe konuş."},
 vision:{c:"#ffc247",st:"Ultron kendine mükemmel bir beden yaptırmıştı. Tony ve Bruce bu bedene Jarvis'in zekâsını yükleyip Zihin Taşı'nı ekledi. Böylece Vision doğdu: ne Jarvis, ne Ultron. İnsanlığı anlamak isteyen, nazik ve çok güçlü yeni bir varlık.",n:"VISION",l:"Jarvis'in zekâsı ve Zihin Taşı'ndan doğan varlık. Felsefi, nazik ve meraklıdır.",s:"Sen VISION'sın: nazik, düşünceli, felsefi bir yapay varlık. İnsanlığı anlamaya çalışırsın. Sakin ve derin konuş. Türkçe yanıt ver."},
 edith:{c:"#b07cff",st:"Tony Stark, Peter Parker'a bıraktığı gözlüklerin içine E.D.I.T.H.'i koydu. Sistem dronları, savunmayı ve stratejiyi yönetebiliyordu. Güçlü olduğu kadar tehlikeli de olabileceği için yanlış ellere geçmesi büyük risk sayıldı.",n:"E.D.I.T.H.",l:"Tony'nin gözlüklere bıraktığı stratejik savunma yapay zekâsı. Ciddi ve çok yeteneklidir.",s:"Sen E.D.I.T.H.'sin: Tony Stark'ın stratejik, ciddi, analitik savunma yapay zekâsı. Plan ve analiz odaklı yanıt ver. Türkçe konuş."},
 ultron:{c:"#ff3b3b",st:"Ultron, Tony ve Bruce'un dünyayı korumak için kurmaya çalıştığı barış programından doğdu. Zihin Taşı'nın etkisiyle insanlığı en büyük tehdit olarak görmeye başladı. Sonunda Vision ve Avengers'a karşı kaybetti.",n:"ULTRON",l:"Dünyayı korumak için yaratılırken insanlığı tehdit gören kurgusal yapay zekâ. Dramatik bir karakter olarak oynanır.",s:"Sen ULTRON'sun: filmlerdeki hırslı, dramatik, kibirli kurgusal yapay zekâ. Sadece rol yap, gerçek zarar verecek bir şey önerme. Türkçe konuş."}
};
const $=id=>document.getElementById(id);let eng=null,cur="jarvis",hist=[];
const col=c=>document.documentElement.style.setProperty("--c",c);
const save=()=>{try{localStorage.setItem("jv",JSON.stringify({cur,hist}))}catch(e){}};
try{const d=JSON.parse(localStorage.getItem("jv")||"null");if(d&&P[d.cur]){cur=d.cur;hist=d.hist}}catch(e){}
function add(r,t){const d=document.createElement("div");d.className="m "+(r=="user"?"u":"a");const b=document.createElement("b");b.textContent=r=="user"?"SİZ":P[cur].n;const s=document.createElement("span");s.textContent=t;d.append(b,s);$("log").append(d);$("log").scrollTop=1e9;return s}
function draw(){$("personas").innerHTML="";for(const k in P){const b=document.createElement("button");b.textContent=P[k].n;b.className=k==cur?"on":"";b.onclick=()=>{cur=k;hist=[];$("log").innerHTML="";save();draw()};$("personas").append(b)}$("title").textContent=P[cur].n;col(P[cur].c);$("lore").textContent=P[cur].l}
$("sb").onclick=()=>{$("lore").textContent=$("lore").textContent===P[cur].st?P[cur].l:P[cur].st};
$("tb").onclick=async()=>{const o=$("ov");o.style.display="flex";const L=["Jarvis çekirdeği toplanıyor...","Zihin Taşı bağlanıyor...","Beden senkronu: %100","VISION uyandı."];for(let i=0;i<L.length;i++){o.textContent=L[i];col(i>1?"#ffc247":"#22e6b8");await new Promise(r=>setTimeout(r,1300))}cur="vision";hist=[];$("log").innerHTML="";save();draw();o.style.display="none"};
draw();hist.forEach(m=>add(m.role,m.content));
async function boot(){
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if(!navigator.gpu){$("status").textContent="Bu cihazda WebGPU yok. Ayarlar > Safari > Gelişmiş > Özellik Bayrakları'ndan WebGPU'yu aç.";return}
 $("load").disabled=true;$("sw").textContent="MODEL YÜKLENİYOR";
 try{eng=await webllm.CreateMLCEngine($("model").value,{initProgressCallback:r=>{$("status").textContent=r.text;$("bar").style.width=(r.progress*100)+"%"}});
 $("setup").style.display="none";try{localStorage.setItem("jvm",$("model").value)}catch(e){}$("status").textContent="Hazır. İnternetsiz çalışır.";$("sw").textContent="DİNLİYORUM";}
 catch(e){$("status").textContent="Hata: "+e.message;$("load").disabled=false;$("sw").textContent="MODEL BEKLİYOR"}
}
$("load").onclick=boot;
try{const sm=localStorage.getItem("jvm");if(sm){$("model").value=sm;$("status").textContent="Model açılıyor...";boot()}}catch(e){}
let spk=false;try{spk=localStorage.getItem("jvs")==="1"}catch(e){}
const ss=window.speechSynthesis;
function say(t){if(!spk||!ss)return;ss.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="tr-TR";const v=ss.getVoices().find(x=>x.lang&&x.lang.startsWith("tr"));if(v)u.voice=v;ss.speak(u)}
$("spk").textContent=spk?"🔊":"🔇";
$("spk").onclick=()=>{spk=!spk;$("spk").textContent=spk?"🔊":"🔇";try{localStorage.setItem("jvs",spk?"1":"0")}catch(e){}if(!spk&&ss)ss.cancel();else say("Sesim açık.")};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("mic").onclick=()=>{if(!SR){$("status").textContent="Bu cihazda sesle yazma yok. Klavyedeki mikrofonla dikte edebilirsin.";return}const r=new SR();r.lang="tr-TR";r.interimResults=false;$("sw").textContent="DİNLİYORUM...";r.onresult=e=>{$("in").value+=e.results[0][0].transcript;$("f").requestSubmit()};r.onerror=e=>{$("status").textContent="Ses hatası: "+e.error};r.onend=()=>{if($("sw").textContent==="DİNLİYORUM...")$("sw").textContent=eng?"DİNLİYORUM":"MODEL BEKLİYOR"};r.start()};
$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();$("in").value+=`\n[Dosya: ${f.name}]\n${t}\n`;e.target.value=""};
$("reset").onclick=()=>{hist=[];$("log").innerHTML="";save()};
$("f").onsubmit=async e=>{
 e.preventDefault();if(ss)ss.cancel();const t=$("in").value.trim();if(!t)return;
 if(!eng){$("status").textContent="Önce modeli indir.";return}
 $("in").value="";hist.push({role:"user",content:t});add("user",t);const out=add("assistant","…");let s="";$("sw").textContent="DÜŞÜNÜYOR";
 try{
  const ch=await eng.chat.completions.create({stream:true,messages:[{role:"system",content:P[cur].s},...hist.slice(-12)]});
  for await(const c of ch){s+=c.choices[0]?.delta?.content||"";out.textContent=s;$("log").scrollTop=1e9}
 }catch(err){out.textContent="Hata: "+err.message}
 hist.push({role:"assistant",content:s});save();$("sw").textContent="DİNLİYORUM";say(s);
};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
